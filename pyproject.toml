[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "nlfsc-lora"
version = "0.1.0"
description = "Nonlinear frequency-shift chirp spread spectrum, modeled on LoRa's CSS"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.23",
    "scipy>=1.9",
    "matplotlib>=3.6",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[tool.setuptools.packages.find]
include = ["nlfsc_lora*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
